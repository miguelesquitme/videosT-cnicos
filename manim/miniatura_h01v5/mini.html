<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;font-family:'Montserrat';position:relative;
 background:radial-gradient(circle at 74% 46%,#1f6fd6 0%,#0d2f6b 34%,#07122b 72%);}
.rayos{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 74% 46%,rgba(255,255,255,.055) 0 6deg,transparent 6deg 15deg)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:64px 64px}
img{position:absolute;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55))}
.km{left:1180px;top:150px;height:690px;transform:rotate(-6deg)}
.glow{position:absolute;left:1120px;top:170px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(84,255,120,.45),transparent 65%)}
.mot{left:1020px;top:640px;height:500px;transform:rotate(3deg)}
.h1{left:1660px;top:90px;height:300px;transform:rotate(8deg)}
.s1{left:1600px;top:410px;height:250px;transform:rotate(-5deg)}
.porfin{position:absolute;left:70px;top:60px;background:#FFD400;color:#0b1020;font-weight:900;font-size:92px;padding:6px 34px 10px;
 transform:rotate(-4deg);box-shadow:10px 10px 0 #E4002B;letter-spacing:1px}
.t1{position:absolute;left:70px;top:230px;width:1100px;color:#fff;font-weight:900;font-size:138px;line-height:.98;
 text-transform:uppercase;letter-spacing:-2px;text-shadow:0 8px 0 rgba(0,0,0,.35)}
.t1 b{color:#FFD400}
.t1 i{font-style:normal;color:#5CFF7A}
.sub{position:absolute;left:76px;top:840px;display:flex;gap:18px}
.sub span{background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.55);color:#fff;font-weight:800;font-size:40px;padding:10px 26px;border-radius:60px}
.on{position:absolute;left:1015px;top:760px;background:#12B76A;color:#fff;font-weight:900;font-size:54px;padding:6px 26px;border-radius:12px;transform:rotate(-3deg);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.logo{left:1770px;top:975px;height:80px;filter:none}
.chispa{position:absolute;stroke:#FFE14D;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px #ffd400)}
</style></head><body>
<div class="rayos"></div><div class="grid"></div><div class="glow"></div>
<img class="mot" src="../h01v5_eq/M1.png">
<img class="km" src="../h01v5_eq/KM1on.png">
<img class="h1" src="../h01v5_eq/H1on.png">
<img class="s1" src="../h01v5_eq/S1.png">
<svg class="chispa" style="left:1090px;top:110px" width="140" height="160"><polyline points="70,5 30,80 80,80 40,155"/></svg>
<svg class="chispa" style="left:1810px;top:560px" width="100" height="130"><polyline points="55,5 20,60 65,60 30,125"/></svg>
<div class="porfin">¡POR FIN!</div>
<div class="t1">Arranco mi <b>primer motor</b> con <i>contactor</i></div>
<div class="sub"><span>Guía paso a paso</span><span>10 hp · 208 V</span></div>
<div class="on">¡ARRANCA! ✓</div>
<img class="logo" src="../logo_oficial.png">
</body></html>
