<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
// Relé térmico CHINT NR2-25 (2,5–4 A), versión realista: PBR + entorno + bordes redondeados. Unidades mm.
const P = new URLSearchParams(location.search);
const VIEW = P.get('v') || 'iso', W = +(P.get('w') || 1400), H = +(P.get('h') || 1400);
const r = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
r.setPixelRatio(2); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const sc = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); sc.environment = pm.fromScene(new RoomEnvironment(), .04).texture;
const cam = new THREE.PerspectiveCamera(20, W / H, 1, 3000);
cam.position.set(...{iso: [185, 145, 300], izq: [-290, 150, -120], frente: [0, 46, 360]}[VIEW]); cam.lookAt(0, 46, -10);
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(90, 190, 160); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.bias = -0.0003; key.shadow.normalBias = .3; key.shadow.radius = 6;
Object.assign(key.shadow.camera, {left: -110, right: 110, top: 130, bottom: -60}); sc.add(key);
const fill = new THREE.DirectionalLight(0xe8efff, .6); fill.position.set(-150, 70, 80); sc.add(fill);
sc.add(new THREE.AmbientLight(0xffffff, .15));

const phys = (c, o = {}) => new THREE.MeshPhysicalMaterial(Object.assign({color: c, roughness: .5, metalness: 0}, o));
const negro = phys(0x17181b, {roughness: .42, clearcoat: .25, clearcoatRoughness: .5});
const negroMate = phys(0x1b1c20, {roughness: .7});
const blanco = phys(0xeef0f2, {roughness: .38, clearcoat: .2});
const gris = phys(0xcfd4da, {roughness: .45});
const cobre = phys(0xeaa06c, {metalness: 1, roughness: .33, envMapIntensity: 1.6});
const niquel = phys(0xe3e6ea, {metalness: 1, roughness: .3, envMapIntensity: 1.8});
const azul = phys(0x1f56d1, {roughness: .3, clearcoat: .5});
const rojo = phys(0xd3202a, {roughness: .28, clearcoat: .6});
const hueco = phys(0x050506, {roughness: .9});
function add(geo, m, x, y, z, rx = 0, ry = 0, rz = 0) {const g = new THREE.Mesh(geo, m); g.position.set(x, y, z); g.rotation.set(rx, ry, rz); g.castShadow = g.receiveShadow = true; sc.add(g); return g}
const rbox = (w, h, d, m, x, y, z, rad = 1.2) => add(new RoundedBoxGeometry(w, h, d, 4, rad), m, x, y, z);
const cyl = (ra, h, m, x, y, z, seg = 64, rb = ra) => add(new THREE.CylinderGeometry(ra, rb, h, seg), m, x, y, z, Math.PI / 2);
function texto(lines, w, h, x, y, z, ry = 0, color = '#1b1f24', bg = null) {
  const s = 40, c = document.createElement('canvas'); c.width = w * s; c.height = h * s; const k = c.getContext('2d');
  if (bg) {k.fillStyle = bg; k.fillRect(0, 0, c.width, c.height)}
  k.fillStyle = color; k.textAlign = 'center'; k.textBaseline = 'middle';
  lines.forEach(([t, px, py, sz, wgt, col]) => {k.fillStyle = col || color; k.font = `${wgt || 700} ${sz * s / 20}px Arial`; k.fillText(t, px * s, py * s)});
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshPhysicalMaterial({map: t, transparent: !bg, roughness: .5, polygonOffset: true, polygonOffsetFactor: -2}));
  m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; sc.add(m); return m;
}
function tornillo(x, y, z, rr = 3.4) {          // tornillo de cabeza combinada (Pozidriv) con arandela-placa de apriete
  rbox(rr * 2.6, rr * 2.6, .8, niquel, x, y, z + .4, .4);
  const cab = add(new THREE.CylinderGeometry(rr, rr * 1.02, 1.8, 48), niquel, x, y, z + 1.6, Math.PI / 2);
  add(new THREE.BoxGeometry(rr * 1.5, .6, .4), hueco, x, y, z + 2.45); add(new THREE.BoxGeometry(.6, rr * 1.5, .4), hueco, x, y, z + 2.45);
}
// ---------- cuerpo
rbox(45, 62, 42, negro, 0, 31, -21, 1.5);            // bloque trasero (bajo el contactor)
rbox(45, 30, 21, negro, 0, 15, 10, 1.5);             // bloque frontal inferior (bornes)
rbox(45, 34, 17, negro, 0, 45, 8, 1.5);              // bloque frontal superior
for (let i = 0; i < 6; i++) add(new THREE.BoxGeometry(.6, 1, 30), negroMate, 22.6, 8 + i * 2.2, -22);   // estrías del costado derecho
rbox(42, 32, 1.2, blanco, 0, 45, 16.6, .6);          // placa frontal
// ---------- bornes de salida 2/T1 4/T2 6/T3 (ventana + tornillo)
for (const x of [-14.5, 0, 14.5]) {rbox(11, 11, 1.2, hueco, x, 9.6, 20.2, .8); tornillo(x, 9.6, 20.2)}
texto([['2/T1', 7.5, 1.4, 30, 700, '#d9dde3'], ['4/T2', 22.5, 1.4, 30, 700, '#d9dde3'], ['6/T3', 37.5, 1.4, 30, 700, '#d9dde3']], 45, 2.8, 0, 2.3, 20.62);
// ---------- regleta de auxiliares 98 NO 97 | 96 NC 95
rbox(43, 10, 1.4, gris, 0, 23, 20.3, .5);
texto([['98', 5.5, 1.1, 26], ['NO', 11, 1.1, 20], ['97', 16.5, 1.1, 26], ['96', 28.5, 1.1, 26], ['NC', 34, 1.1, 20], ['95', 39.5, 1.1, 26]], 43, 2.2, 0, 26.9, 21.05);
for (const x of [-16, -6, 6, 16]) {rbox(7.2, 6.2, .8, hueco, x, 22.3, 21.1, .6); tornillo(x, 22.3, 21.1, 2.5)}
// ---------- dial azul moleteado con escala impresa
cyl(9.4, 1.4, negro, -9, 46, 17.6, 64);
const dial = cyl(7.7, 3.4, azul, -9, 46, 19.4, 96);
for (let i = 0; i < 36; i++) {const a = i / 36 * Math.PI * 2; add(new THREE.BoxGeometry(.5, .9, 3.2), azul, -9 + 7.75 * Math.cos(a), 46 + 7.75 * Math.sin(a), 19.4, 0, 0, a)}
texto([['2.5', 2.4, 6.4, 34, 800, '#fff'], ['3', 4.9, 2.6, 34, 800, '#fff'], ['3.5', 10.9, 2.6, 34, 800, '#fff'], ['4', 13.6, 6.4, 34, 800, '#fff']], 16, 9, -9, 48.4, 21.15);
add(new THREE.BoxGeometry(1.3, 8.5, 1), hueco, -9, 44.6, 21);       // ranura para destornillador
add(new THREE.ConeGeometry(1.1, 2.2, 3), phys(0xffffff), -9, 39.8, 21.15, 0, 0, Math.PI);
texto([['▲', 1, 1, 30]], 2, 2, -9, 36.6, 17.25);
// ---------- TEST, indicador, STOP, RESET
rbox(5, 2.8, 1.6, rojo, -13.5, 33.2, 17.6, .5); texto([['TEST', 3, 1, 22]], 6, 2, -6.4, 33.2, 17.25);
rbox(6, 3.4, .6, phys(0x5c6470, {roughness: .1, transmission: 0}), 5, 56.4, 17.3, .3); rbox(3.6, 1.8, .4, phys(0x2c9b52, {roughness: .3}), 5, 56.4, 17.55, .2);
cyl(4.8, 2, negro, 7, 43, 17.8, 64);
add(new THREE.SphereGeometry(4, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2.6), rojo, 7, 43, 18.4, Math.PI / 2); cyl(4, 1.6, rojo, 7, 43, 18.6, 64);
cyl(4.8, 2, negro, 17, 43, 17.8, 64); cyl(4, 2.8, azul, 17, 43, 19.2, 64);
add(new THREE.BoxGeometry(5, .9, .8), hueco, 17, 43, 20.65); add(new THREE.BoxGeometry(.9, 5, .8), hueco, 17, 43, 20.65);
texto([['STOP', 3, 1, 24, 800], ['RESET', 13, 1, 24, 800]], 16, 2, 12, 49.2, 17.25);
texto([['H', .8, 1, 22, 800, '#1f56d1'], ['A', 7.2, 1, 22, 800, '#1f56d1']], 8, 2, 17, 37.5, 17.25);
texto([['CHINT', 6, 1.3, 34, 900], ['NR2-25', 6, 3.3, 22, 700]], 12, 4.6, -12, 58.4, 17.25);
texto([['2.5-4A', 3, 1, 22, 800]], 6, 2, 15.5, 58.6, 17.25);
// ---------- pines de cobre (entrada) y gancho
for (const x of [-15, 0, 15]) {rbox(7, 4, 8, negro, x, 64, -28, .8); rbox(4.4, 30, 1.6, cobre, x, 79, -28, .5)}
rbox(5, 16, 3, negro, -7.5, 70, -37, .6); rbox(5, 3, 6.5, negro, -7.5, 77, -35, .6);
// ---------- placa de datos en el costado izquierdo (solo datos de la ficha)
texto([['CHINT  NR2-25', 13, 2.3, 34, 900], ['2.5-4A   Class 10A', 13, 5.5, 26], ['Ue 690V~', 13, 8.3, 26], ['IEC/EN 60947-4-1', 13, 11.1, 26]], 26, 13.5, -22.62, 36, -14, -Math.PI / 2, '#1b1f24', '#e6e9ee');
// ---------- piso de sombra
const piso = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.ShadowMaterial({opacity: .18}));
piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; sc.add(piso);
r.render(sc, cam);
const pts = {
  pines: [0, 88, -28], gancho: [-7.5, 78, -35], dial: [-9, 46, 21], test: [-13.5, 33.2, 18.4], stop: [7, 43, 22.3], reset: [17, 43, 21],
  indicador: [5, 56.4, 17.8], aux: [0, 23, 21.5], salida: [14.5, 9.6, 22.8], placa: [-22.7, 36, -14], cuerpo: [22.5, 30, -20]
};
window.pts = {};
for (const [k, v] of Object.entries(pts)) {const p = new THREE.Vector3(...v).project(cam); window.pts[k] = [(p.x + 1) / 2, (1 - p.y) / 2]}
window.done = true;
</script></body></html>
